[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gauss-ai"
version = "0.89.1"
description = "GAUSS programming assistant: official-docs search, deterministic code validation and a human-approved execution handoff, as an MCP server and CLI."
readme = "docs/pypi-readme.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eric Clower" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/ec78/gauss-ai"
Repository = "https://github.com/ec78/gauss-ai"
Documentation = "https://github.com/ec78/gauss-ai#readme"
Issues = "https://github.com/ec78/gauss-ai/issues"

[project.optional-dependencies]
# Only required to run the local MCP server (`gauss-ai mcp` / `gauss-ai-mcp`);
# the base CLI remains stdlib-only with no third-party runtime dependency.
mcp = ["mcp>=2.3.0"]

[project.scripts]
gauss-ai = "gauss_ai_cli:main"
gauss-ai-mcp = "gauss_mcp_server:main"

[tool.setuptools]
package-dir = { "" = "scripts" }
# v0.89.0 (planning v0.89 §2.1, §3.1, decision 13): product modules only.
# The developer tools (build_differential_corpus, check_evaluation_tracking,
# check_release_readiness, gauss_differential_harness,
# gauss_syntax_mutations, validate_all_evidence, validate_lookup_evidence)
# stay in scripts/ and run from a checkout; installing them put generic
# top-level names such as `check_release_readiness` into site-packages.
py-modules = [
    "command_doc_lookup",
    "gauss_ai_chat",
    "gauss_ai_cli",
    "gauss_ai_config",
    "gauss_ai_doctor",
    "gauss_ai_export",
    "gauss_ai_guided_repair",
    "gauss_ai_init",
    "gauss_chat_provider",
    "gauss_code_assistant_cli",
    "gauss_code_assistant_workflow",
    "gauss_code_execution",
    "gauss_conversation_engine",
    "gauss_doc_concept_index",
    "gauss_doc_reader",
    "gauss_docs_fetch",
    "gauss_environment_check",
    "gauss_error_catalog",
    "gauss_execution_adapter",
    "gauss_execution_diagnostics",
    "gauss_execution_handoff",
    "gauss_execution_interpreter",
    "gauss_execution_session",
    "gauss_execution_workflow",
    "gauss_mcp_server",
    "gauss_orchestration_state_store",
    "gauss_package_inspection",
    "gauss_pre_execution_validation",
    "gauss_repair_application",
    "gauss_repair_application_approval",
    "gauss_repair_application_gate",
    "gauss_repair_approval",
    "gauss_repair_draft",
    "gauss_repair_draft_approval",
    "gauss_repair_draft_generation",
    "gauss_repair_planner",
    "gauss_repair_session_summary",
    "gauss_runtime_orchestration",
    "gauss_verification_execution",
    "gauss_verification_review",
    "gauss_workspace",
    "gauss_workspace_file_reader",
]
